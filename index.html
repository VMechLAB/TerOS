<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TerOS</title>
<link rel="stylesheet" href="teros.css">
</head>
<body>

<div id="crt"></div>

<div id="boot">
  <svg class="boot-mark" viewBox="0 0 80 80">
    <path class="boot-outline" d="M40 10 C27 20 19 33 21 46 C23 60 35 68 45 68 C56 68 63 56 61 42 C59 28 50 18 40 10 Z"/>
    <path class="boot-vein" d="M40 12 C39 30 43 50 45 66"/>
    <path class="boot-branch" d="M33 34 C37 36 41 37 45 37"/>
    <path class="boot-branch" d="M31 45 C35 47 41 48 47 47"/>
    <path class="boot-branch" d="M33 56 C37 58 42 58 48 56"/>
  </svg>
  <div class="boot-word">TerOS</div>
  <div class="boot-note">a small forest, opening</div>
</div>  

<div id="wallpaper"></div>

<div id="desktop">
  <div id="widgets"></div>
  <div id="windows-layer"></div>
</div>

<div id="taskbar">
  <button id="start-btn"><span class="start-glyph">&#9670;</span> TerOS</button>
  <div id="tasks"></div>
  <div id="tray-clock">--:--</div>
</div>

<div id="start-menu"></div>

<div id="about-modal" class="modal-backdrop">
  <div class="modal">
    <div class="titlebar">
      <span class="title">About TerOS</span>
      <div class="controls"><button class="tbtn" id="about-close">X</button></div>
    </div>
    <div class="modal-body">
      <pre class="ascii-tree">      /\
     /  \
    /    \
   /  /\  \
  /__/  \__\</pre>
      <p><b>TerOS</b> &mdash; version 1.0<br>
      A simulated nature OS in your browser.<br>
      Everything here is make-believe.</p>
      <p class="dim">Named after the Greek for "other".</p>
    </div>
    <div class="modal-actions">
      <button class="btn" id="about-ok">OK</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="teros-core.js"></script>
<script src="teros-apps.js"></script>
</body>
</html>
